[workspace]
resolver = "3"
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds. There is no root
# package: the crate a host loads is `crates/tinysecurity-module`, the same as any other
# member. Keeping the root virtual is what makes that uniform — a root package
# would make one crate structurally different from the rest for no reason other
# than history, and it is the arrangement this template moved away from.
members = ["crates/*"]
# `vendor/` holds the pinned TinyBus submodule, which is its own workspace with
# its own lockfile. `worktrees/` holds `git worktree` checkouts of this same
# repository; each contains a full copy of this manifest and every crate under
# it, so without this entry cargo walks into them and reports duplicate
# packages.
exclude = ["vendor", "worktrees"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so the version the release workflow bumps is written in exactly one
# place and every crate moves together.
[workspace.package]
version = "0.17.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinysecurity"

[workspace.dependencies]
# Accepted driver owns secret ports, historical ChaCha formats and the native OS keyring.
tinystoragedrivers = { path = "vendor/tinystoragedrivers/crates/tinystoragedrivers", default-features = false, features = ["secrets", "keyring"] }
# Private password, credential, device and pairing engines, never host-linked.
tinysecurity-crypto = { path = "crates/tinysecurity-crypto" }
# Safe native HKDF owns and wipes IKM/PRK/HMAC contexts for device derivation.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["non-fips"] }
# Preserve the device X25519 and XChaCha wire primitives with retained-state cleanup.
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
# AEAD does not forward these expanded-state cleanup features.
chacha20 = { version = "0.9.1", default-features = false, features = ["zeroize"] }
poly1305 = { version = "0.8.0", default-features = false, features = ["zeroize"] }
# Strict URL-safe unpadded device public-key encoding.
base64 = "0.22"
# Preserve the password payload's AES-256-GCM wire format.
aes-gcm = { version = "0.10", features = ["zeroize"] }
# AES-GCM does not forward zeroize to its expanded AES key schedule.
aes = { version = "0.8", features = ["zeroize"] }
# Wipe GHASH setup copies and the backing POLYVAL authentication state.
ghash = { version = "0.5", features = ["zeroize"] }
polyval = { version = "0.6", features = ["zeroize"] }
# Preserve the Argon2id v0x13 password derivation parameters.
argon2 = { version = "0.5", features = ["zeroize"] }
# Clear native key material and decrypted buffers on drop.
zeroize = "1"
# Private declarative sandbox planner, never linked by a host.
tinysecurity-sandbox = { path = "crates/tinysecurity-sandbox" }
# Optional probabilistic approval engine remains native and host-inaccessible.
tinysecurity-auto = { path = "crates/tinysecurity-auto" }
# Validated typed Jev HTTP client, pinned by the owner submodule gitlink.
tinyinference-decisions = { path = "vendor/tinyinference/crates/tinyinference-decisions", version = "0.3.1", default-features = false }
# Internal durable exact approval engine, never host-linked.
tinysecurity-approval = { path = "crates/tinysecurity-approval" }
# Object-safe authenticated asynchronous callback ports.
async-trait = "0.1"
# Native audit engine remains internal to the module.
tinysecurity-audit = { path = "crates/tinysecurity-audit" }
# The wire contract. `crates/tinysecurity-module` depends on it and re-exports it, so a
# host that only makes calls takes this crate alone.
# No `version` requirement on purpose: the workspace version moves on every
# release, and a pinned requirement here would stop resolving the moment it did.
# Nothing in this workspace is published, so the path is the whole address.
tinysecurity-bus = { path = "crates/tinysecurity-bus" }
# Policy implementation and internal umbrella, never linked by hosts.
tinysecurity-policy = { path = "crates/tinysecurity-policy" }
# Private native DNS, destination and privacy engine.
tinysecurity-egress = { path = "crates/tinysecurity-egress" }
tinysecurity = { path = "crates/tinysecurity" }
# Unified bounded native registry, never linked by hosts.
tinysecurity-redact = { path = "crates/tinysecurity-redact" }
# Linear-time secret/identifier patterns, compiled once at initialization.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
# Stable eight-hex identifier pseudonyms for explicit identifier mode.
sha2 = "0.10"
# Local endpoint parsing; no network access or resolution.
url = "2"
# TinyBus defines the message types, interface macro, and frozen module ABI
# used by the generated integration. Socket and CLI features are unnecessary
# here.
tinybus = { path = "vendor/tinybus/crates/tinybus", version = "0.1.0", default-features = false, features = [
    "macros",
    "modules",
] }
# The module-side SDK owns the isolated runtime and exports the ABI entrypoints
# required by TinyBus's dynamic loader.
tinybus-module = { path = "vendor/tinybus/crates/tinybus-module", version = "0.1.0" }
# Derive macros for the crate-wide error type in `crates/tinysecurity-module/src/error/`.
# Every dependency entry should carry a comment like this one saying why it is
# here.
# OS entropy for opaque module-process scope references.
getrandom = "0.3"
# Conservative denial comparison on case-insensitive/normalizing filesystems.
unicode-normalization = "0.1"
thiserror = "2"
# The bus payload types are serialized into TinyBus frames.
serde = { version = "1", features = ["derive"] }
# Positional argument arrays and the module configuration blob.
serde_json = "1"
# Module integration tests exercise the real asynchronous in-memory TinyBus.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }

# Disposable filesystem fixtures for native path policy tests.
[workspace.dependencies.tempfile]
version = "3"

# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
